version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: supervision_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: supervision
      POSTGRES_PASSWORD: supervision123
      POSTGRES_DB: supervision_db
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supervision -d supervision_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: supervision_backend
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    # command: npm run start:dev

volumes:
  db_data:
